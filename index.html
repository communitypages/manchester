<style id="app-css">:root{
  --paper:#F3F5EF; --card:#FFFFFF; --ink:#15302B; --muted:#56706A; --line:#D6DED5;
  --accent:#1C6B61; --accent-ink:#FFFFFF; --accent-soft:#DCEBE6;
  --bee:#F2C230; --bee-ink:#3A2C00; --brick:#9E3F28; --brick-soft:#F6E1D9;
  --shadow:0 1px 2px rgba(21,48,43,.06),0 6px 24px rgba(21,48,43,.07);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1917; --card:#162420; --ink:#E4EDE8; --muted:#9BB0A8; --line:#293C36;
  --accent:#62C3B3; --accent-ink:#0B1F1B; --accent-soft:#1D3A34;
  --bee:#E3B52C; --bee-ink:#2A1F00; --brick:#EE9A80; --brick-soft:#3A241D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F1917; --card:#162420; --ink:#E4EDE8; --muted:#9BB0A8; --line:#293C36;
  --accent:#62C3B3; --accent-ink:#0B1F1B; --accent-soft:#1D3A34;
  --bee:#E3B52C; --bee-ink:#2A1F00; --brick:#EE9A80; --brick-soft:#3A241D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:880px;margin:0 auto;padding-inline:16px}
header.top{padding-block:28px 12px}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center}
.hex{width:14px;height:16px;background:var(--bee);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:inline-block}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.kin{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:clamp(15px,3vw,19px);color:var(--accent);letter-spacing:-.01em}
.lede{margin:10px 0 0;color:var(--muted);max-width:60ch}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--brick);color:var(--card)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}

.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1.5px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.sel{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 10px;max-width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--accent);width:17px;height:17px}
.count{font-size:14px;color:var(--muted);margin:14px 0 4px}

.day{margin-top:18px}
.dayhead{display:flex;align-items:baseline;gap:10px;padding-block:6px;border-bottom:2px solid var(--ink)}
.dnum{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.dname{font-weight:700}
.dmonth{color:var(--muted)}
.dtag{margin-left:auto;font-size:13px;font-weight:700;background:var(--bee);color:var(--bee-ink);padding:2px 8px;border-radius:6px}

.ev{display:grid;grid-template-columns:78px 1fr;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.time{font-variant-numeric:tabular-nums;font-weight:700;line-height:1.3}
.time small{display:block;font-weight:400;color:var(--muted)}
.evtitle{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;margin:0;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.evtitle:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.meta.addr{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta.addr[aria-expanded="true"]{white-space:normal}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.tag.free{background:var(--bee);color:var(--bee-ink)}
.tag.book{background:var(--brick-soft);color:var(--brick)}
.tag.cat{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400}
.detail{margin-top:10px;padding:12px 14px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);font-size:15px}
.detail p{margin:0 0 8px}
.detail .kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin-bottom:8px}
.detail .kv dt{color:var(--muted)}
.detail .kv dd{margin:0;overflow-wrap:anywhere}
.admin-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

.area{margin-top:26px}
.area h2{font-family:var(--display);font-size:24px;margin:0 0 4px}
.venue{margin-top:14px;background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.venue h3{margin:0;font-size:16px}
.venue .addr{color:var(--muted);font-size:14px}
.sess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding-block:10px;border-top:1px solid var(--line)}
.sess:first-of-type{margin-top:8px}
.sess .when{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sess .right{text-align:right;font-size:14px}

.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{padding-block:40px;color:var(--muted);font-size:14px}

dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,18,.55)}
.form{padding:20px}
.form h2{font-family:var(--display);margin:0 0 12px;font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:14px;min-width:0}
.field span{color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick label{border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;display:flex;gap:4px;align-items:center}
.form .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.msg{font-size:14px;color:var(--brick);margin:6px 0 0}
.note{font-size:13px;color:var(--muted)}
@media (max-width:520px){.ev{grid-template-columns:62px 1fr}.grid2{grid-template-columns:1fr}.detail .kv{grid-template-columns:1fr}.dnum{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.detail{animation:pop .15s ease-out}@keyframes pop{from{transform:translateY(-3px);opacity:.6}}}
@media (max-width:600px){
header.top{padding-block:14px 4px}
.eyebrow{font-size:11px;margin-bottom:2px}
h1{font-size:26px}
.lede{margin-top:4px;font-size:15px}
.filters{position:static;padding-block:8px 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.search{grid-column:1/-1;padding:8px 10px;border-radius:10px}
.sel{width:100%;min-width:0;padding:7px 8px;font-size:15px;border-radius:10px}
#pickdate{order:5;grid-column:1/-1}
.chips{padding-block:6px 0}
.chip{padding:4px 10px;font-size:13px}
.count{margin:8px 0 0}
.day{margin-top:10px}
}
.pcrow{margin-top:8px}
.pcin{flex:0 1 230px;min-width:0;text-transform:uppercase}
.pcin::placeholder{text-transform:none}
.pcmsg{font-size:13px;color:var(--muted);flex:1 1 200px}
@media (max-width:600px){.pcrow{margin-top:6px}.pcin{width:100%}.pcmsg{grid-column:1/-1}}

.printbtn{margin-left:auto}
#printout{display:none}
@media (max-width:600px){.printbtn{grid-column:1/-1;margin-left:0}}
@media print{
@page{size:A4;margin:10mm}
html,body{background:#fff!important;color:#000!important}
#app>*:not(#printout){display:none!important}
#printout{display:block!important;font:8.5pt/1.25 var(--body);color:#000}
.p-head{border-bottom:1.5px solid #000;padding-bottom:3px;margin-bottom:4px}
.p-head h1{font-size:15pt;margin:0;display:inline}
.p-head p{margin:1px 0 0;font-size:8.5pt}
.p-cols{column-count:2;column-gap:6mm}
.p-day{font-family:var(--display);font-size:10.5pt;margin:5px 0 1px;padding-bottom:1px;border-bottom:1px solid #000;break-after:avoid}
.p-ev{padding:1.5px 0;border-bottom:.4pt solid #ccc;break-inside:avoid}
.p-ev b{font-size:9pt}
.p-ev .t{font-weight:700;font-variant-numeric:tabular-nums}
.p-ev div{font-size:8pt;color:#222}
.p-foot{margin-top:6px;font-size:7.5pt;border-top:1px solid #000;padding-top:3px}
}
</style>

  var weekly={}, seen={}, oneoffs=[];
  for(var d=from; d<=to; d=addDays(d,1)){
    pool.forEach(function(ev){
      if(!occursOn(ev,d)) return;
      if(ev.rule){var k=ev.id+"@"+d.getDay(); if(seen[k])return; seen[k]=1; (weekly[d.getDay()]=weekly[d.getDay()]||[]).push(ev);}
      else{ var k2=ev.id; if(seen[k2])return; seen[k2]=1; oneoffs.push([d,ev]); }
    });
  }
  var multiDay=iso(from)!==iso(to), body="";
  [1,2,3,4,5,6,0].forEach(function(wd){
    var items=weekly[wd]; if(!items) return; items.sort(pSort); total+=items.length;
    body+='<h2 class="p-day">'+(multiDay?DN[wd]+'s':DN[wd])+'</h2>';
    items.forEach(function(ev){
      var extra="";
      if(ev.rule.freq==="monthly") extra=ruleText(ev.rule);
      else if(ev.rule.interval>1) extra="Every other week";
      else if(ev.note) extra=ev.note;
      body+=pItem(ev,extra);
    });
  });
  if(oneoffs.length){
    body+='<h2 class="p-day p-one">One-off events</h2>';
    oneoffs.forEach(function(x){ total++; body+=pItem(x[1],'').replace('<span class="t">','<span class="t">'+esc(fmtDate(iso(x[0])))+', '); });
  }
  var span=iso(from)===iso(to)?fmtDate(iso(from)):fmtDate(iso(from))+' to '+fmtDate(iso(to));
  var f=[span];
  if(userLL())f.push('within '+S.near+(S.near==="1"?' mile':' miles')+' of '+S.pc.toUpperCase());
  if(S.cat)f.push(S.cat);
  if(S.q)f.push('search: “'+S.q+'”');
  var t=today();
  document.getElementById("printout").innerHTML=
   '<div class="p-head"><h1>Community Pages</h1><p><b>'+esc(f.join(" · "))+'</b> · '+total+' activities · free, donation or under £5</p></div>'+
   (total?'<div class="p-cols">'+body+'</div>':'<p>Nothing matches these filters.</p>')+
   '<div class="p-foot">Printed '+t.getDate()+' '+MONLONG[t.getMonth()]+' '+t.getFullYear()+'. Details can change – check with the organiser before going. Full list and details: communitypages.org.uk</div>';
  try{window.print();}catch(e){}
}

  ''+

  var pk=document.getElementById("pickdate"); pk.min=iso(today()); pk.max=iso(addDays(today(),120)); pk.value=S.date||iso(today());
  document.getElementById("when").addEventListener("change",function(e){S.when=e.target.value;if(S.when==="date"){if(!S.date||S.date<iso(today()))S.date=iso(today());pk.value=S.date;}remember();render();if(S.when==="date"){try{pk.showPicker&&pk.showPicker()}catch(_){}}});

function render(){
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",String(t.getAttribute("data-tab")===S.tab))});
  document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c.getAttribute("data-cat")===S.cat))});
  document.getElementById("when").hidden=S.tab!=="on";

  var pm=document.getElementById("pcmsg"),hasPc=!!(S.pc||"").trim(),okPc=!!userLL();document.getElementById("near").hidden=!okPc;
  pm.textContent=hasPc&&!okPc?(outward(S.pc).length>=2?"Postcode not recognised – try the first part, e.g. M19 or SK4":""):(okPc?"Distances are approximate, based on postcode area.":"");
  S.tab="on"; S.free=false; S.drop=false; S.oneoff=false; list.innerHTML = S.tab==="on"?renderOn():renderReg();

function renderOn(){
  var r=range(), from=r[0], to=r[1], t=iso(today());
  var pool=EVENTS.filter(function(ev){return matches(ev) && !(S.oneoff && ev.rule)});
  var html="", total=0;
  for(var d=from; d<=to; d=addDays(d,1)){
    var items=pool.filter(function(ev){return occursOn(ev,d)});
    if(!items.length) continue;
    items.sort(function(a,b){return (a.start||"00:00").localeCompare(b.start||"00:00")||a.title.localeCompare(b.title)});
    total+=items.length;
    var s=iso(d), tag=s===t?"Today":(s===iso(addDays(today(),1))?"Tomorrow":"");
    html+='<section class="day"><div class="dayhead"><span class="dnum">'+d.getDate()+'</span><span class="dname">'+["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+'</span><span class="dmonth">'+MONLONG[d.getMonth()]+'</span>'+(tag?'<span class="dtag">'+tag+'</span>':'')+'</div>';
    items.forEach(function(ev){
      var key=ev.id+"@"+s, open=!!S.open[key];
      html+='<article class="ev"><div class="time">'+(ev.start?esc(ev.start)+(ev.end?'<small>to '+esc(ev.end)+'</small>':''):'All day')+'</div><div>'+
      '<button class="evtitle" data-open="'+esc(key)+'" aria-expanded="'+open+'">'+esc(shortTitle(ev))+'</button>'+
      '<button type="button" class="meta addr" aria-expanded="false" data-full="'+esc(ev.venue||"")+'" data-short="'+esc(metaShort(ev)+(distText(ev)?" · "+distText(ev):""))+'">'+esc(metaShort(ev)+(distText(ev)?" · "+distText(ev):""))+'</button>'+
      '<div class="tags">'+tagsHTML(ev,true)+'</div>'+(open?detailHTML(ev):'')+'</div></article>';
    });
    html+='</section>';
  }
  var label={today:"today",tomorrow:"tomorrow",weekend:"this weekend",week:"in the next 7 days",month:"in the next 30 days",all:"coming up"}[S.when]; if(S.when==="date"){var pd=parse(S.date);label=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][pd.getDay()]+" "+pd.getDate()+" "+MONLONG[pd.getMonth()];}
  if(!total) return '<p class="empty">Nothing matches '+label+(userLL()?' within '+S.near+(S.near==="1"?' mile':' miles')+' of '+esc(S.pc.toUpperCase()):'')+'. Try a wider date range'+(userLL()?', a bigger distance':'')+' or fewer filters.</p>';
  return html;
}
function renderReg(){
  var pool=EVENTS.filter(function(ev){return ev.rule && matches(ev) && !(ev.rule.until && ev.rule.until<iso(today()))});
  if(!pool.length) return '<p class="empty">No regular groups match. Try fewer filters.</p>';
  var by={};
  pool.forEach(function(ev){ (by[ev.area]=by[ev.area]||{}); var v=ev.venue; (by[ev.area][v]=by[ev.area][v]||[]).push(ev); });
  var order=AREAS.filter(function(a){return by[a]}).concat(Object.keys(by).filter(function(a){return AREAS.indexOf(a)<0}));
  var dayIdx=function(ev){var i=DAYS.indexOf((ev.rule.byday||["SU"])[0]);return i===0?7:i};
  var html='<p class="count">'+pool.length+' regular sessions at '+order.reduce(function(n,a){return n+Object.keys(by[a]).length},0)+' places. Tap a session for details.</p>';
  order.forEach(function(a){
    html+='<section class="area"><h2>'+esc(a)+'</h2>';
    Object.keys(by[a]).sort().forEach(function(v){
      var list=by[a][v].sort(function(x,y){return dayIdx(x)-dayIdx(y)||(x.start||"").localeCompare(y.start||"")});
      var parts=v.split(",");
      html+='<div class="venue"><h3>'+esc(parts[0])+'</h3><div class="addr">'+esc(parts.slice(1).join(",").trim())+'</div>';
      list.forEach(function(ev){
        var key=ev.id+"@reg", open=!!S.open[key];
        html+='<div class="sess"><div><button class="evtitle" style="font-size:16px" data-open="'+esc(key)+'" aria-expanded="'+open+'">'+esc(ev.title)+'</button><div class="when">'+esc(ruleText(ev.rule))+' · '+esc(timeText(ev))+'</div></div><div class="right"><div class="tags" style="margin-top:0;justify-content:flex-end">'+tagsHTML(ev,false).replace(/<span class="tag">(Weekly|Monthly)<\/span>/,"")+'</div></div>'+(open?'<div style="grid-column:1/-1">'+detailHTML(ev)+'</div>':'')+'</div>';
      });
      html+='</div>';
    });
    html+='</section>';
  });
  return html;
}
function onListClick(e){
  var o=e.target.closest("[data-open]");
  if(o){var k=o.getAttribute("data-open");S.open[k]=!S.open[k];render();return;}
  var ed=e.target.closest("[data-edit]");
  if(ed){openForm(find(ed.getAttribute("data-edit")));return;}
  var dl=e.target.closest("[data-del]");
  if(dl){
    var row=dl.parentNode, id=dl.getAttribute("data-del");
    row.innerHTML='<span style="align-self:center">Delete this event for everyone?</span><button class="btn small danger" data-delyes="'+esc(id)+'">Delete</button><button class="btn small ghost" data-delno>Cancel</button>';
    return;
  }
  var y=e.target.closest("[data-delyes]");
  if(y){ var ev=find(y.getAttribute("data-delyes")); y.disabled=true; y.textContent="Deleting…";
    save(EVENTS.filter(function(x){return x!==ev}),function(err){ y.disabled=false; y.textContent="Delete"; y.parentNode.insertAdjacentHTML("beforeend",'<p class="msg">'+esc(err)+'</p>'); }); return; }
  if(e.target.closest("[data-delno]")){render();}
}
function find(id){for(var i=0;i<EVENTS.length;i++) if(EVENTS[i].id===id) return EVENTS[i]; return null;}

/* ---------- editing ---------- */
var dlg=null;
function opt(list,val){return list.map(function(x){return '<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>'}).join("")}
function openForm(ev){
  var isNew=!ev; ev=ev||{title:"",date:iso(today()),start:"",end:"",venue:"",area:"",category:"Community",cost:"Free",booking:"",info:"",link:""};
  var r=ev.rule||{};
  if(!dlg){dlg=document.createElement("dialog");document.body.appendChild(dlg);}
  var dayBoxes=["MO","TU","WE","TH","FR","SA","SU"].map(function(d){return '<label><input type="checkbox" name="byday" value="'+d+'"'+((r.byday||[]).indexOf(d)>=0?' checked':'')+'>'+DAYNAME[d].slice(0,3)+'</label>'}).join("");
  var posBoxes=[[1,"1st"],[2,"2nd"],[3,"3rd"],[4,"4th"],[-1,"Last"]].map(function(p){return '<label><input type="checkbox" name="pos" value="'+p[0]+'"'+((r.pos||[]).indexOf(p[0])>=0?' checked':'')+'>'+p[1]+'</label>'}).join("");
  dlg.innerHTML='<form class="form" id="evform" novalidate><h2>'+(isNew?"Add an event":"Edit event")+'</h2>'+
  '<label class="field"><span>Name of event</span><input id="f-title" required value="'+esc(ev.title)+'"></label>'+
  '<label class="field"><span>Run by (optional)</span><input id="f-org" value="'+esc(ev.org||"")+'"></label>'+
  '<div class="grid2"><label class="field"><span>Date (first date if it repeats)</span><input id="f-date" type="date" required value="'+esc(ev.date)+'"></label>'+
  '<label class="field"><span>Last day (only if it runs several days)</span><input id="f-enddate" type="date" value="'+esc(ev.endDate||"")+'"></label></div>'+
  '<div class="grid2"><label class="field"><span>Starts (leave blank for all day)</span><input id="f-start" type="time" value="'+esc(ev.start||"")+'"></label>'+
  '<label class="field"><span>Finishes</span><input id="f-end" type="time" value="'+esc(ev.end||"")+'"></label></div>'+
  '<label class="field"><span>Repeats</span><select id="f-freq"><option value="">Doesn\'t repeat</option><option value="weekly"'+(r.freq==="weekly"?" selected":"")+'>Every week</option><option value="monthly"'+(r.freq==="monthly"?" selected":"")+'>Every month</option></select></label>'+
  '<div id="f-rep"'+(r.freq?'':' hidden')+'><div class="field"><span>On which day(s)</span><div class="daypick">'+dayBoxes+'</div></div>'+
  '<div class="field" id="f-posw"'+(r.freq==="monthly"?'':' hidden')+'><span>Which week of the month</span><div class="daypick">'+posBoxes+'</div></div>'+
  '<label class="field"><span>Stop listing after (optional)</span><input id="f-until" type="date" value="'+esc(r.until||"")+'"></label></div>'+
  '<label class="field"><span>Venue and address</span><input id="f-venue" required value="'+esc(ev.venue)+'"></label>'+
  '<div class="grid2"><label class="field"><span>Area</span><select id="f-area">'+opt(AREAS,ev.area||"Other / check venue")+'</select></label>'+
  '<label class="field"><span>Type</span><select id="f-cat">'+opt(CATS,ev.category)+'</select></label></div>'+
  '<div class="grid2"><label class="field"><span>Price</span><select id="f-cost">'+opt(COSTS,ev.cost||"Free")+'</select></label>'+
  '<label class="field"><span>Booking</span><select id="f-book"><option value="">Not stated</option><option'+(ev.booking==="Drop in"?" selected":"")+'>Drop in</option><option'+(ev.booking==="Book first"?" selected":"")+'>Book first</option></select></label></div>'+
  '<label class="field"><span>Details, contact, booking info</span><textarea id="f-info">'+esc(ev.info||"")+'</textarea></label>'+
  '<label class="field"><span>Link (optional)</span><input id="f-link" type="url" placeholder="https://" value="'+esc(ev.link||"")+'"></label>'+
  '<p class="msg" id="f-msg" hidden></p>'+
  '<div class="actions"><button type="button" class="btn ghost" id="f-cancel">Cancel</button><button type="submit" class="btn" id="f-save">'+(isNew?"Add event":"Save changes")+'</button></div>'+
  '<p class="note">Saving updates the page for everyone who has the link.</p></form>';
  var $=function(id){return document.getElementById(id)};
  $("f-freq").addEventListener("change",function(e){$("f-rep").hidden=!e.target.value;$("f-posw").hidden=e.target.value!=="monthly"});

  $("evform").addEventListener("submit",function(e){
    e.preventDefault();
    var msg=$("f-msg"); msg.hidden=true;
    var n={id:ev.id||("e"+Date.now().toString(36)),title:$("f-title").value.trim(),venue:$("f-venue").value.trim(),date:$("f-date").value,area:$("f-area").value,category:$("f-cat").value,cost:$("f-cost").value};if(ev&&ev.cal)n.cal=1;

    if((v=$("f-end").value) && n.start) n.end=v;
    if((v=$("f-book").value)) n.booking=v;
    if((v=$("f-info").value.trim())) n.info=v;
    if((v=$("f-link").value.trim())) n.link=/^https?:\/\//.test(v)?v:"https://"+v;
    if(ev.note) n.note=ev.note;

    if(freq){

function pageSource(events){
  var css=document.getElementById("app-css").textContent;
  var js=document.getElementById("app-js").textContent;
  var data=JSON.stringify(events).replace(/</g,"\\u003c");
  return '<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+
  '<title>Community Pages</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
  '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">'+
  '<style id="app-css">'+css+'</style></head><body><div id="app"></div>'+
  '<script type="application/json" id="events-data">'+data+'<\/script>'+
  '<script id="app-js">'+js+'<\/script></body></html>';
}
function save(events,onErr){
  if(!art){onErr("Saving isn't available in this view.");return;}
  remember();
  art.publish(pageSource(events)).then(function(){ /* the page reloads to the new version */ },function(err){
    var c=err&&err.code;
    if(c==="conflict") return; // page is reloading to the newest version
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"){readOnly=true;onErr("You can view this page but can't edit it.");return;}
    if(c==="rate_limited"){onErr("Too many saves in a row. Wait a minute and try again.");return;}
    if(c==="too_large"){onErr("The page is too big to save. Delete some old events first.");return;}
    onErr("Couldn't save just now. Try again in a moment.");
  });
}

/* ---------- start ---------- */
shell(); render();
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
setInterval(function(){if(!document.hidden&&!document.querySelector(".detail"))render()},300000);
/* editing removed: read-only page */
})();
