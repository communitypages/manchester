# Rebuilds the website from the "MCR Free Community Events" Google Calendar every morning at 9am.
# No AI involved. Reads the calendar through the repository secret CALENDAR_ICAL_URL
# (Google Calendar > Settings > the calendar > "Secret address in iCal format"). The calendar itself is private.
name: Update site from calendar

on:
  schedule:
    - cron: '0 9 * * *'    # every day at 9am UTC (9am UK time in winter, 10am in summer)
  push:
    branches: [main]
    paths: ['.github/workflows/update-site.yml', 'scripts/**']
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if lots of listings would disappear'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install icalendar==7.* recurring-ical-events==3.*
      - name: Read the calendar
        env:
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
        run: |
          if [ -z "$CALENDAR_ICAL_URL" ]; then echo "::error::Secret CALENDAR_ICAL_URL is not set"; exit 1; fi
          URL="$CALENDAR_ICAL_URL"
          TODAY=$(TZ=Europe/London date +%F)
          END=$(TZ=Europe/London date -d '+90 days' +%F)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          echo "END=$END" >> $GITHUB_ENV
          python3 scripts/read_calendar.py --url "$URL" --out "$RUNNER_TEMP/pages" --from "$TODAY" --to "$END"
      - name: Rebuild the page
        run: |
          python3 scripts/build_site.py --pages "$RUNNER_TEMP/pages" --today "$TODAY" --window-end "$END" \
            ${{ inputs.force && '--force' || '' }}
      - name: Publish if anything changed
        run: |
          git config user.name "Community Pages bot"
          git config user.email "hello@communitypages.org.uk"
          # If someone else pushes to main while this runs, the push is rejected.
          # In that case, start again from the latest main, rebuild and retry (up to 3 times).
          for attempt in 1 2 3; do
            git add index.html sitemap.xml llms.txt llms-full.txt area activity
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Update events from calendar ($TODAY)"
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt) - rebuilding on latest main"
            sleep 10
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_site.py --pages "$RUNNER_TEMP/pages" --today "$TODAY" --window-end "$END" \
              ${{ inputs.force && '--force' || '' }}
          done
          echo "::error::Could not push after 3 attempts"
          exit 1
