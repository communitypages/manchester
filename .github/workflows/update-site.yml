# Rebuilds the website from the "MCR Free Community Events" Google Calendar every morning.
# No AI involved. Uses the secret CALENDAR_ICAL_URL if set (Google Calendar > Settings > the calendar >
# "Secret address in iCal format"); otherwise the calendar's public address (calendar must be public).
name: Update site from calendar

on:
  schedule:
    - cron: '23 5 * * *'   # every day, about 5:23am UTC
  push:
    branches: [main]
    paths: ['.github/workflows/update-site.yml', 'scripts/**']
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if lots of listings would disappear'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install icalendar==7.* recurring-ical-events==3.*
      - name: Read the calendar
        env:
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
          PUBLIC_ICAL_URL: https://calendar.google.com/calendar/ical/184b8c166f44ce5ae5a5c962fc7a176159e216a1ec3747dc7d4c36b017c9daaa%40group.calendar.google.com/public/basic.ics
        run: |
          URL="${CALENDAR_ICAL_URL:-$PUBLIC_ICAL_URL}"
          TODAY=$(TZ=Europe/London date +%F)
          END=$(TZ=Europe/London date -d '+150 days' +%F)
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          echo "END=$END" >> $GITHUB_ENV
          python3 scripts/read_calendar.py --url "$URL" --out "$RUNNER_TEMP/pages" --from "$TODAY" --to "$END"
      - name: Rebuild the page
        run: |
          python3 scripts/build_site.py --pages "$RUNNER_TEMP/pages" --today "$TODAY" --window-end "$END" \
            ${{ inputs.force && '--force' || '' }}
      - name: Publish if anything changed
        run: |
          git config user.name "Community Pages bot"
          git config user.email "hello@communitypages.org.uk"
          git add index.html sitemap.xml llms.txt llms-full.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update events from calendar ($TODAY)"
          git push
